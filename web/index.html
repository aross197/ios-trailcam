<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>TrailCam Web</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --fg: #e0e0e0;
      --accent: #4ade80;
      --danger: #f87171;
      --muted: #666;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
      overflow-x: hidden;
    }
    h1 {
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }
    .status {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 12px;
      min-height: 1.2em;
    }
    .status.active { color: var(--accent); }
    .status.alert { color: var(--danger); }
    .video-wrap {
      position: relative;
      width: 100%;
      max-width: 640px;
      background: #111;
      border-radius: 12px;
      overflow: hidden;
      aspect-ratio: 4/3;
    }
    video, canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    canvas { display: none; }
    .controls {
      width: 100%;
      max-width: 640px;
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    label {
      font-size: 0.8rem;
      color: var(--muted);
      display: block;
      margin-bottom: 4px;
    }
    input[type="text"], input[type="number"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #333;
      border-radius: 8px;
      background: #1a1a1a;
      color: var(--fg);
      font-size: 0.95rem;
    }
    input:focus {
      outline: none;
      border-color: var(--accent);
    }
    .row {
      display: flex;
      gap: 12px;
    }
    .row > div { flex: 1; }
    button {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button:active { opacity: 0.8; }
    #startBtn {
      background: var(--accent);
      color: #000;
    }
    #startBtn.running {
      background: var(--danger);
      color: #fff;
    }
    .log {
      width: 100%;
      max-width: 640px;
      margin-top: 16px;
      font-size: 0.8rem;
      color: var(--muted);
      max-height: 120px;
      overflow-y: auto;
      font-family: ui-monospace, monospace;
    }
    .log div { margin-bottom: 4px; }
    .hint {
      font-size: 0.75rem;
      color: #555;
      margin-top: 8px;
      text-align: center;
      max-width: 640px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <h1>TrailCam Web</h1>
  <div id="status" class="status">Ready — press Start Camera</div>

  <div class="video-wrap">
    <video id="video" playsinline muted></video>
    <canvas id="canvas"></canvas>
  </div>

  <div class="controls">
    <div>
      <label for="topic">ntfy topic URL</label>
      <input type="text" id="topic" value="https://ntfy.sh/your_unique_trailcam_topic_here" placeholder="https://ntfy.sh/your-topic" />
    </div>
    <div class="row">
      <div>
        <label for="threshold">Motion threshold (lower = more sensitive)</label>
        <input type="number" id="threshold" value="25" min="5" max="80" step="1" />
      </div>
      <div>
        <label for="cooldown">Cooldown (seconds)</label>
        <input type="number" id="cooldown" value="5" min="1" max="60" step="1" />
      </div>
    </div>
    <button id="startBtn">Start Camera</button>
  </div>

  <div id="log" class="log"></div>
  <p class="hint">
    Works best on mobile Chrome/Safari. Allow camera permission. Use a private ntfy topic.
    Motion detection runs every ~1s and uploads a JPEG on trigger.
  </p>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const statusEl = document.getElementById('status');
    const startBtn = document.getElementById('startBtn');
    const logEl = document.getElementById('log');
    const topicInput = document.getElementById('topic');
    const thresholdInput = document.getElementById('threshold');
    const cooldownInput = document.getElementById('cooldown');

    let stream = null;
    let running = false;
    let lastSampleTime = 0;
    let lastTriggerTime = 0;
    let previousImageData = null;
    let animId = null;

    function log(msg) {
      const time = new Date().toLocaleTimeString();
      const div = document.createElement('div');
      div.textContent = `[${time}] ${msg}`;
      logEl.prepend(div);
      while (logEl.children.length > 30) logEl.removeChild(logEl.lastChild);
    }

    function setStatus(text, cls = '') {
      statusEl.textContent = text;
      statusEl.className = 'status ' + cls;
    }

    async function startCamera() {
      if (running) {
        stopCamera();
        return;
      }

      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 640 },
            height: { ideal: 480 }
          },
          audio: false
        });
        video.srcObject = stream;
        await video.play();

        // Match canvas to video size once metadata is ready
        video.addEventListener('loadedmetadata', () => {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
        }, { once: true });

        running = true;
        startBtn.textContent = 'Stop Camera';
        startBtn.classList.add('running');
        setStatus('Camera active — watching for motion', 'active');
        log('Camera started');
        requestAnimationFrame(processFrame);
      } catch (err) {
        console.error(err);
        setStatus('Camera error: ' + err.message, 'alert');
        log('Failed to start camera: ' + err.message);
      }
    }

    function stopCamera() {
      running = false;
      if (animId) cancelAnimationFrame(animId);
      if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
      }
      video.srcObject = null;
      previousImageData = null;
      startBtn.textContent = 'Start Camera';
      startBtn.classList.remove('running');
      setStatus('Stopped');
      log('Camera stopped');
    }

    function processFrame() {
      if (!running) return;

      const now = Date.now();
      // Throttle to ~1 fps for motion checks
      if (now - lastSampleTime < 1000) {
        animId = requestAnimationFrame(processFrame);
        return;
      }
      lastSampleTime = now;

      if (video.readyState < 2 || canvas.width === 0) {
        animId = requestAnimationFrame(processFrame);
        return;
      }

      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);

      if (previousImageData) {
        const threshold = Number(thresholdInput.value) || 25;
        if (detectMotion(imageData, previousImageData, threshold)) {
          const cooldown = (Number(cooldownInput.value) || 5) * 1000;
          if (now - lastTriggerTime > cooldown) {
            lastTriggerTime = now;
            log('Motion detected — capturing');
            setStatus('Motion detected! Uploading…', 'alert');
            uploadPhoto();
          }
        }
      }

      previousImageData = imageData;
      animId = requestAnimationFrame(processFrame);
    }

    function detectMotion(current, previous, threshold) {
      const data = current.data;
      const prev = previous.data;
      const step = 16; // sample every 16th pixel (RGBA = 4 bytes)
      let diffSum = 0;
      let count = 0;

      for (let i = 0; i < data.length; i += step * 4) {
        // Compare green channel only (good enough + slightly cheaper)
        const d = Math.abs(data[i + 1] - prev[i + 1]);
        diffSum += d;
        count++;
      }

      const avg = count > 0 ? diffSum / count : 0;
      return avg > threshold;
    }

    async function uploadPhoto() {
      const topic = topicInput.value.trim();
      if (!topic || topic.includes('your_unique')) {
        log('Set a real ntfy topic URL first');
        setStatus('Set a real ntfy topic URL', 'alert');
        return;
      }

      // Capture current frame as JPEG
      canvas.toBlob(async (blob) => {
        if (!blob) {
          log('Failed to create JPEG');
          return;
        }

        try {
          const res = await fetch(topic, {
            method: 'POST',
            headers: {
              'Title': 'TrailCam Event',
              'Content-Type': 'image/jpeg'
            },
            body: blob
          });

          if (res.ok) {
            log('Uploaded successfully');
            setStatus('Upload OK — watching again', 'active');
          } else {
            log('Upload failed: HTTP ' + res.status);
            setStatus('Upload failed', 'alert');
          }
        } catch (err) {
          log('Upload error: ' + err.message);
          setStatus('Upload error', 'alert');
        }
      }, 'image/jpeg', 0.6);
    }

    startBtn.addEventListener('click', startCamera);

    // Prevent screen sleep on supported browsers while running
    let wakeLock = null;
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (_) {}
    }
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && running) requestWakeLock();
    });
  </script>
</body>
</html>
